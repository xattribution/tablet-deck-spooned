# Builds TabletDeck.exe, voice.exe and the installer on Windows, and publishes a GitHub
# Release for v* tags.
#
#   git tag v2.0.0 && git push origin v2.0.0    build and publish "Tablet Deck 2.0.0"
#   Actions -> Release -> Run workflow          build only; download from the run's artifacts
#
# Code signing is optional (Azure Artifact Signing). Set these and release builds are
# signed; otherwise they're unsigned and SmartScreen warns about an unknown publisher:
#   secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   variables SIGNING_ENDPOINT (e.g. https://wus2.codesigning.azure.net/),
#             SIGNING_ACCOUNT, SIGNING_PROFILE
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && vars.SIGNING_ACCOUNT != '' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "2.0.0-dev." + "${{ github.run_number }}" }
          $num = ($v -split "[-+]")[0]
          "VERSION=$v" >> $env:GITHUB_ENV
          "FILEVERSION=$num.0" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag") {
            node scripts/release-notes.js $v > $null
            if ($LASTEXITCODE -ne 0) { throw "Add a '## $v' section to CHANGELOG.md." }
          }

      - name: Test
        run: go test ./...

      - name: Build TabletDeck.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\app | Out-Null
          Copy-Item cmd\tabletdeck\app.ico build\icon.ico
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon cmd/tabletdeck/app.ico --manifest gui `
            --product-name "Tablet Deck" --file-description "Tablet Deck" --product-version $env:FILEVERSION --file-version $env:FILEVERSION `
            --out cmd/tabletdeck/rsrc
          go build -trimpath -ldflags "-H windowsgui -s -w -X github.com/xattribution/tablet-deck-spooned.Version=$env:VERSION" -o build\app\TabletDeck.exe ./cmd/tabletdeck

      # The fallback voice engine (Windows speech), for PCs without the speech models.
      - name: Build voice.exe
        shell: pwsh
        run: |
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & "$fw\csc.exe" /nologo /optimize /target:exe /platform:x64 "/lib:$fw\WPF" /r:System.Speech.dll /out:build\app\voice.exe native\voice.cs
          if ($LASTEXITCODE -ne 0) { throw "voice.cs didn't compile" }

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: build\app
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DFileVersion=$env:FILEVERSION" "/DBuildDir=$PWD\build" installer\TabletDeck.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: build
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: pwsh
        run: |
          $setup = "build\TabletDeck-Setup-$env:VERSION.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $setup -Leaf) | Set-Content "$setup.sha256"
          Compress-Archive -Path build\app\* -DestinationPath "build\TabletDeck-$env:VERSION-portable.zip"
          Copy-Item scripts\install.ps1 build\install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TabletDeck-${{ env.VERSION }}
          path: |
            build/TabletDeck-Setup-*.exe*
            build/TabletDeck-*-portable.zip
            build/install.ps1

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (node scripts/release-notes.js $env:VERSION) -join "`n"
          gh release create "${{ github.ref_name }}" "build\TabletDeck-Setup-$env:VERSION.exe" "build\TabletDeck-Setup-$env:VERSION.exe.sha256" `
            "build\TabletDeck-$env:VERSION-portable.zip" build\install.ps1 --title "Tablet Deck $env:VERSION" --notes $notes
