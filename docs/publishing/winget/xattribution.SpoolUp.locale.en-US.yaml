InstallationNotes: |-
  Open SpoolUp from the Start menu: its window shows the QR code, address and pairing code for your tablet.
  WinGet doesn't copy the Star Citizen keybind profile into the game; add it with Settings > Install keybind profile... in the SpoolUp window, then load "SpoolUp Keyboard" in the game.
