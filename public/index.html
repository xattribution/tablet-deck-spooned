<!doctype html>
<html lang="en" data-theme="rsi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tablet Deck">
<meta name="theme-color" content="#0A0E13">
<title>Tablet Deck</title>
<!-- No start_url in the manifest: a home screen app opens the address it was added
     from, pairing code included, so it never asks again. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Without internet the deck falls back to system fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Rajdhani:wght@600;700&family=Saira+Stencil+One&family=Saira+Condensed:wght@600;700&family=Marcellus&family=Cinzel:wght@600;700&family=Exo+2:wght@600;700&family=Montserrat:wght@300;500;700&family=Oxanium:wght@600;700&family=Chakra+Petch:wght@600;700&display=swap">
<link rel="stylesheet" href="deck3.css">
</head>
<body>
<main id="console" aria-label="Deck"></main>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="qr.js"></script>
<script src="icons.js"></script>
<script src="icons2.js"></script>
<script src="emblems.js"></script>
<script src="deck3.js"></script>
<script src="awake.js"></script>
<script>
  // Quicker starts and an offline shell where browsers allow a service worker
  // (https: a share link through a tunnel, or localhost).
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
</script>
</body>
</html>
